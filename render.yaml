services:
  - type: web
    name: paraflow
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24.19.0"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: CORS_ORIGINS
        value: ""
      - key: ALLOW_SIMULATION
        value: "true" # Demonstração: simulador restrito ao dono da empresa.
      - key: MQTT_TOPIC_PREFIX
        value: paraflow-guicampos06-demo-20261113
      # Broker público autorizado somente para simulação com dados fictícios.
      # Mensagens, tokens da máquina e comandos ficam expostos a outros clientes.
      - key: MQTT_URL
        value: mqtt://broker.hivemq.com:1883
# Para dados reais, substitua por broker privado com TLS, credenciais e ACL.
# Free serve para demonstração: pode hibernar e interromper ingestão MQTT.
